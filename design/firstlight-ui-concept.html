:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {

}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:

.form-select:focus-visible {

  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {

  align-items: center;
  gap: 6px;

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;firstlight-product-mockup&#x27;);
      const product = root.querySelector(&#x27;.firstlight-window&#x27;);
      const folderTile = root.querySelector(&#x27;.folder-tile&#x27;);
      const primaryMenu = root.querySelector(&#x27;.cascade-primary&#x27;);
      const submenuTrigger = root.querySelector(&#x27;.submenu-trigger&#x27;);
      const secondaryMenu = root.querySelector(&#x27;.cascade-secondary&#x27;);
      const settingsTrigger = root.querySelector(&#x27;.settings-trigger&#x27;);
      const settingsDrawer = root.querySelector(&#x27;.settings-drawer&#x27;);
      const drawerScrim = root.querySelector(&#x27;.drawer-scrim&#x27;);
      const diffLayer = root.querySelector(&#x27;.diff-layer&#x27;);
      const searchInput = root.querySelector(&#x27;.search-input&#x27;);
      const searchResults = root.querySelector(&#x27;.search-results&#x27;);
      const toast = root.querySelector(&#x27;.toast&#x27;);
      const toastText = root.querySelector(&#x27;.toast-text&#x27;);
      const gradientControls = root.querySelector(&#x27;.background-controls:not(.solid-controls)&#x27;);
      const solidControls = root.querySelector(&#x27;.solid-controls&#x27;);
      const gradientColorOne = root.querySelector(&#x27;.gradient-color-one&#x27;);
      const gradientColorTwo = root.querySelector(&#x27;.gradient-color-two&#x27;);
      const solidColor = root.querySelector(&#x27;.solid-color&#x27;);
      let gradientAngle = 135;

      const closeMenus = () =&gt; {
        primaryMenu.classList.remove(&#x27;open&#x27;);
        secondaryMenu.classList.remove(&#x27;open&#x27;);
        folderTile.classList.remove(&#x27;active&#x27;);
        submenuTrigger.classList.remove(&#x27;active&#x27;);
        folderTile.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
        submenuTrigger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      };

      const closeSettings = () =&gt; {
        settingsDrawer.classList.remove(&#x27;open&#x27;);
        drawerScrim.classList.remove(&#x27;open&#x27;);
        settingsTrigger.classList.remove(&#x27;active&#x27;);
        settingsTrigger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;false&#x27;);
      };

      const openSettings = () =&gt; {
        closeMenus();
        settingsDrawer.classList.add(&#x27;open&#x27;);
        drawerScrim.classList.add(&#x27;open&#x27;);
        settingsTrigger.classList.add(&#x27;active&#x27;);
        settingsTrigger.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
      };

      const showToast = message =&gt; {
        toastText.textContent = message;
        toast.classList.add(&#x27;open&#x27;);
        window.setTimeout(() =&gt; toast.classList.remove(&#x27;open&#x27;), 1800);
      };

      folderTile.addEventListener(&#x27;click&#x27;, event =&gt; {
        event.stopPropagation();
        const willOpen = !primaryMenu.classList.contains(&#x27;open&#x27;);
        closeMenus();
        if (willOpen) {
          primaryMenu.classList.add(&#x27;open&#x27;);
          folderTile.classList.add(&#x27;active&#x27;);
          folderTile.setAttribute(&#x27;aria-expanded&#x27;, &#x27;true&#x27;);
        }
      });

      submenuTrigger.addEventListener(&#x27;click&#x27;, event =&gt; {
        event.stopPropagation();
        const willOpen = !secondaryMenu.classList.contains(&#x27;open&#x27;);
        secondaryMenu.classList.toggle(&#x27;open&#x27;, willOpen);
        submenuTrigger.classList.toggle(&#x27;active&#x27;, willOpen);
        submenuTrigger.setAttribute(&#x27;aria-expanded&#x27;, String(willOpen));
      });

      product.addEventListener(&#x27;click&#x27;, event =&gt; {
        if (!event.target.closest(&#x27;.cascade&#x27;) &amp;&amp; !event.target.closest(&#x27;.folder-tile&#x27;)) closeMenus();
      });

      settingsTrigger.addEventListener(&#x27;click&#x27;, openSettings);
      root.querySelector(&#x27;.close-settings&#x27;).addEventListener(&#x27;click&#x27;, closeSettings);
      drawerScrim.addEventListener(&#x27;click&#x27;, closeSettings);

      root.querySelectorAll(&#x27;.segmented button&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.segmented button&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
        });
      });

      const applyBackground = () =&gt; {
        if (product.dataset.background === &#x27;solid&#x27;) {
          product.style.background = solidColor.value;
          return;
        }
        product.style.background = `linear-gradient(${gradientAngle}deg, ${gradientColorOne.value}, ${gradientColorTwo.value})`;
      };

      root.querySelectorAll(&#x27;.background-choice&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.background-choice&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          product.dataset.background = button.dataset.choice;
          const isSolid = button.dataset.choice === &#x27;solid&#x27;;
          solidControls.classList.toggle(&#x27;open&#x27;, isSolid);
          gradientControls.classList.toggle(&#x27;hidden&#x27;, isSolid);
          applyBackground();
        });
      });

      gradientColorOne.addEventListener(&#x27;input&#x27;, applyBackground);
      gradientColorTwo.addEventListener(&#x27;input&#x27;, applyBackground);
      solidColor.addEventListener(&#x27;input&#x27;, applyBackground);

      root.querySelectorAll(&#x27;.direction-button&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.direction-button&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          gradientAngle = Number(button.dataset.angle);
          applyBackground();
        });
      });

      root.querySelectorAll(&#x27;.preset-button&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          root.querySelectorAll(&#x27;.preset-button&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, &#x27;false&#x27;));
          button.setAttribute(&#x27;aria-pressed&#x27;, &#x27;true&#x27;);
          const [first, second] = button.dataset.colors.split(&#x27;,&#x27;);
          gradientColorOne.value = first;
          gradientColorTwo.value = second;
          product.dataset.background = &#x27;gradient&#x27;;
          root.querySelectorAll(&#x27;.background-choice&#x27;).forEach(peer =&gt; peer.setAttribute(&#x27;aria-pressed&#x27;, String(peer.dataset.choice === &#x27;gradient&#x27;)));
          solidControls.classList.remove(&#x27;open&#x27;);
          gradientControls.classList.remove(&#x27;hidden&#x27;);
          applyBackground();
        });
      });

      searchInput.addEventListener(&#x27;input&#x27;, () =&gt; {
        const hasQuery = searchInput.value.trim().length &gt; 0;
        searchResults.classList.toggle(&#x27;open&#x27;, hasQuery);
      });

      searchInput.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key === &#x27;Escape&#x27;) {
          searchInput.value = &#x27;&#x27;;
          searchResults.classList.remove(&#x27;open&#x27;);
          searchInput.blur();
        }
      });

      const openDiff = historyMode =&gt; {
        closeSettings();
        closeMenus();
        root.querySelector(&#x27;.left-diff-title&#x27;).textContent = &#x27;本机&#x27;;
        root.querySelector(&#x27;.right-diff-title&#x27;).textContent = historyMode ? &#x27;恢复点 · 今天 09:18&#x27; : &#x27;远端&#x27;;
        root.querySelector(&#x27;.use-left&#x27;).textContent = historyMode ? &#x27;保留当前状态&#x27; : &#x27;用本机覆盖远端&#x27;;
        root.querySelector(&#x27;.use-right&#x27;).textContent = historyMode ? &#x27;恢复到此版本&#x27; : &#x27;用远端覆盖本机&#x27;;
        diffLayer.classList.add(&#x27;open&#x27;);
      };

      root.querySelectorAll(&#x27;.open-diff&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openDiff(false)));
      root.querySelectorAll(&#x27;.open-history&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; openDiff(true)));
      root.querySelector(&#x27;.close-diff&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; diffLayer.classList.remove(&#x27;open&#x27;));
      root.querySelector(&#x27;.use-left&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        diffLayer.classList.remove(&#x27;open&#x27;);
        showToast(&#x27;已保留本机状态&#x27;);
      });
      root.querySelector(&#x27;.use-right&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const historyMode = root.querySelector(&#x27;.use-right&#x27;).textContent.includes(&#x27;此版本&#x27;);
        diffLayer.classList.remove(&#x27;open&#x27;);
        showToast(historyMode ? &#x27;已恢复到历史版本&#x27; : &#x27;已恢复到远端快照&#x27;);
      });

      root.querySelector(&#x27;.upload-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        closeSettings();
        showToast(&#x27;已上传到远端&#x27;);
      });

      root.querySelector(&#x27;.token-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;Token 已保存在本机&#x27;));
      root.querySelector(&#x27;.manager-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;将在扩展中打开 Chrome 书签管理器&#x27;));
      root.querySelector(&#x27;.gist-link-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;将在扩展中打开对应 Gist&#x27;));
      root.querySelector(&#x27;.disconnect-action&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; showToast(&#x27;设计预览：连接保持不变&#x27;));

      if (window.location.hash === &#x27;#settings&#x27;) openSettings();
      if (window.location.hash === &#x27;#diff&#x27;) openDiff(false);

      root.addEventListener(&#x27;keydown&#x27;, event =&gt; {
        if (event.key !== &#x27;Escape&#x27;) return;
        if (diffLayer.classList.contains(&#x27;open&#x27;)) diffLayer.classList.remove(&#x27;open&#x27;);
        else if (settingsDrawer.classList.contains(&#x27;open&#x27;)) closeSettings();
        else closeMenus();
      });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
